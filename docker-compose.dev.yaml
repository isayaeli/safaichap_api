x-app-env: &app-env
  DJANGO_ENV: development
  DJANGO_SETTINGS_MODULE: config.settings.development
  DB_HOST: db
  DB_PORT: "5432"
  REDIS_URL: redis://redis:6379/0
  REDIS_CACHE_URL: redis://redis:6379/1
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0

services:

  # ─────────────────────────────────────────
  # SafariChap App
  # ─────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: docker/safarichap/Dockerfile.dev
    container_name: safarichap_app_dev
    volumes:
      - .:/app                          # live reload in dev
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      <<: *app-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    networks:
      - safarichap_network

  # ─────────────────────────────────────────
  # Celery Worker
  # ─────────────────────────────────────────
  celery_worker:
    build:
      context: .
      dockerfile: docker/safarichap/Dockerfile.dev
    container_name: safarichap_celery_worker_dev
    command: celery -A config.celery worker --loglevel=info -E
    volumes:
      - .:/app
    env_file: .env
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "false"
    depends_on:
      - app
      - redis
    restart: always
    networks:
      - safarichap_network

  # ─────────────────────────────────────────
  # Celery Beat (scheduler)
  # ─────────────────────────────────────────
  celery_beat:
    build:
      context: .
      dockerfile: docker/safarichap/Dockerfile.dev
    container_name: safarichap_celery_beat_dev
    command: celery -A config.celery beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    env_file: .env
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "false"
    depends_on:
      - app
      - redis
    restart: always
    networks:
      - safarichap_network

  # ─────────────────────────────────────────
  # PostgreSQL
  # ─────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: safarichap_db_dev
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"                     # exposed for local DB tools
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - safarichap_network

  # ─────────────────────────────────────────
  # Redis
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: safarichap_redis_dev
    ports:
      - "6379:6379"                     # exposed for local inspection
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - safarichap_network

  # ─────────────────────────────────────────
  # Nginx
  # ─────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: safarichap_nginx_dev
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - app
    restart: always
    networks:
      - safarichap_network

  # ─────────────────────────────────────────
  # Prometheus
  # ─────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: safarichap_prometheus_dev
    volumes:
      - ./docker/prometheus/prometheus.dev.yaml:/etc/prometheus/prometheus.yaml
      - prometheus_data_dev:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yaml'
      - '--storage.tsdb.retention.time=7d'
    depends_on:
      - app
    restart: always
    networks:
      - safarichap_network

  # ─────────────────────────────────────────
  # Grafana
  # ─────────────────────────────────────────
  grafana:
    image: grafana/grafana:12.1.0
    container_name: safarichap_grafana_dev
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data_dev:/var/lib/grafana
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      - prometheus
    restart: always
    networks:
      - safarichap_network

  # ─────────────────────────────────────────
  # Node Exporter (server metrics)
  # ─────────────────────────────────────────
  node_exporter:
    image: prom/node-exporter:v1.9.1
    container_name: safarichap_node_exporter_dev
    ports:
      - "9100:9100"
    restart: always
    networks:
      - safarichap_network

  # ─────────────────────────────────────────
  # Celery Exporter (celery metrics)
  # ─────────────────────────────────────────
  celery_exporter:
    image: danihodovic/celery-exporter:0.10.14
    container_name: safarichap_celery_exporter_dev
    environment:
      - CE_BROKER_URL=redis://redis:6379/0
    ports:
      - "9808:9808"
    depends_on:
      - redis
    restart: always
    networks:
      - safarichap_network

  # ─────────────────────────────────────────
  # Postgres Exporter (db metrics)
  # ─────────────────────────────────────────
  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    container_name: safarichap_postgres_exporter_dev
    environment:
      - DATA_SOURCE_NAME=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=disable
    ports:
      - "9187:9187"
    depends_on:
      - db
    restart: always
    networks:
      - safarichap_network

# ─────────────────────────────────────────
# Volumes
# ─────────────────────────────────────────
volumes:
  postgres_data_dev:
  static_volume:
  media_volume:
  prometheus_data_dev:
  grafana_data_dev:

# ─────────────────────────────────────────
# Networks
# ─────────────────────────────────────────
networks:
  safarichap_network:
    driver: bridge
