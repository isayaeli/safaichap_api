# docker/nginx/nginx.conf
# Per-IP flood guard in front of Django's per-user throttles (config/settings/base.py).
# This file is included in nginx's http block (conf.d/default.conf), where these must live.
limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
limit_req_status 429;
limit_conn_status 429;

upstream django {
    server app:8000;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 10M;

    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # Static files
    location /static/ {
        alias /app/staticfiles/;
    }

    # Media files
    location /media/ {
        alias /app/media/;
    }

    # Prometheus scrapes the app directly on the internal network; don't expose metrics publicly.
    location = /metrics {
        deny all;
    }

    # Proxy to Django app
    location / {
        limit_req zone=api_per_ip burst=40 nodelay;
        limit_conn conn_per_ip 20;
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
