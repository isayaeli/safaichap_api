x-app-env: &app-env
  DJANGO_ENV: production
  DJANGO_SETTINGS_MODULE: config.settings.production
  DB_HOST: db
  DB_PORT: "5432"
  REDIS_URL: redis://redis:6379/0
  REDIS_CACHE_URL: redis://redis:6379/1
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  FIREBASE_CREDENTIALS_PATH: /run/secrets/safarichap/firebase-adminsdk.json

x-app: &app
  build:
    context: .
    dockerfile: docker/safarichap/Dockerfile
  image: safarichap_api:latest
  env_file: .env
  volumes:
    - media_volume:/app/media
    - ./secrets:/run/secrets/safarichap:ro   # Firebase service account (never baked into the image)
  restart: always
  networks:
    - safarichap_network

services:

  # ─────────────────────────────────────────
  # SafariChap App (HTTP / REST)
  # ─────────────────────────────────────────
  app:
    <<: *app
    container_name: safarichap_app
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ./secrets:/run/secrets/safarichap:ro
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ─────────────────────────────────────────
  # Celery Worker
  # ─────────────────────────────────────────
  celery_worker:
    <<: *app
    container_name: safarichap_celery_worker
    command: celery -A config.celery worker --loglevel=warning --concurrency=4
    environment:
      <<: *app-env
    depends_on:
      - app
      - redis

  # ─────────────────────────────────────────
  # Celery Beat (scheduler)
  # ─────────────────────────────────────────
  celery_beat:
    <<: *app
    container_name: safarichap_celery_beat
    command: celery -A config.celery beat --loglevel=warning --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      <<: *app-env
    depends_on:
      - app
      - redis

  # ─────────────────────────────────────────
  # PostgreSQL
  # ─────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: safarichap_db
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - safarichap_network

  # ─────────────────────────────────────────
  # Redis
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: safarichap_redis
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - safarichap_network

  # ─────────────────────────────────────────
  # Nginx
  # ─────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: safarichap_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
    restart: always
    networks:
      - safarichap_network

  # ─────────────────────────────────────────
  # Prometheus
  # ─────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: safarichap_prometheus
    volumes:
      - ./docker/prometheus/prometheus.prod.yaml:/etc/prometheus/prometheus.yaml
      - ./docker/prometheus/alerts.yaml:/etc/prometheus/alerts.yaml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yaml'
      - '--storage.tsdb.retention.time=30d'
    restart: always
    networks:
      - safarichap_network

  # ─────────────────────────────────────────
  # Grafana
  # ─────────────────────────────────────────
  grafana:
    image: grafana/grafana:12.1.0
    container_name: safarichap_grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      - prometheus
    restart: always
    networks:
      - safarichap_network

  # ─────────────────────────────────────────
  # Node Exporter
  # ─────────────────────────────────────────
  node_exporter:
    image: prom/node-exporter:v1.9.1
    container_name: safarichap_node_exporter
    restart: always
    networks:
      - safarichap_network

  # ─────────────────────────────────────────
  # Celery Exporter
  # ─────────────────────────────────────────
  celery_exporter:
    image: danihodovic/celery-exporter:0.10.14
    container_name: safarichap_celery_exporter
    environment:
      - CE_BROKER_URL=redis://redis:6379/0
    depends_on:
      - redis
    restart: always
    networks:
      - safarichap_network

  # ─────────────────────────────────────────
  # Postgres Exporter
  # ─────────────────────────────────────────
  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    container_name: safarichap_postgres_exporter
    environment:
      - DATA_SOURCE_NAME=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=disable
    depends_on:
      - db
    restart: always
    networks:
      - safarichap_network

# ─────────────────────────────────────────
# Volumes
# ─────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  prometheus_data:
  grafana_data:

# ─────────────────────────────────────────
# Networks
# ─────────────────────────────────────────
networks:
  safarichap_network:
    driver: bridge
